name: ci-cd

# PR을 열거나 갱신하면 check만 돌고(AWS 권한 필요 없음),
# main에 합쳐지면 check를 다시 돌린 뒤 ENABLE_DEPLOY=true 일 때만 release가 배포한다.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# 같은 브랜치에서 배포가 겹쳐 돌지 않게 한다. 진행 중인 배포는 취소하지 않고 기다린다.
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-serve.txt

      - name: 의존성 설치
        run: pip install -r requirements-serve.txt

      - name: 서버를 켜고 정상·오류 요청 검사
        env:
          BUILD_REVISION: ${{ github.sha }}
        run: |
          python -m uvicorn src.api:app --port 8000 > /tmp/server.log 2>&1 &
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/health && break; sleep 1; done
          python src/check_api.py --out /tmp/api-check.json
          python scripts/verify_api_check.py /tmp/api-check.json --revision "$GITHUB_SHA"

      - name: 서버 로그 (실패 시)
        if: failure()
        run: tail -n 50 /tmp/server.log || true

      - name: 컨테이너를 빌드하고 같은 검사 실행
        run: |
          docker build --build-arg BUILD_REVISION="$GITHUB_SHA" -t bike-api:ci .
          docker run -d --name bike-api-ci -p 8001:8000 bike-api:ci
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:8001/health && break; sleep 2; done
          python src/check_api.py --url http://127.0.0.1:8001 --out /tmp/api-check-container.json
          python scripts/verify_api_check.py /tmp/api-check-container.json --revision "$GITHUB_SHA"

      - name: 컨테이너 로그 (실패 시)
        if: failure()
        run: docker logs --tail 50 bike-api-ci || true

  release:
    needs: check
    # PR 실행에서는 배포하지 않는다. 저장소 변수 ENABLE_DEPLOY가 'true'가 아니면 건너뛴다.
    if: github.event_name == 'push' && vars.ENABLE_DEPLOY == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC로 AWS 역할을 받기 위해 필요
      contents: read
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-2' }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'bike-api' }}
      EC2_TAG_NAME: ${{ vars.EC2_TAG_NAME || 'bike-api' }}
      CLOUDWATCH_LOG_GROUP: ${{ vars.CLOUDWATCH_LOG_GROUP }}
    steps:
      - uses: actions/checkout@v4

      - name: AWS 역할 받기 (장기 액세스 키 없이 OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: ECR 로그인
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 이미지 빌드·push (태그 = 커밋 번호)
        id: image
        run: |
          image_uri="${{ steps.ecr.outputs.registry }}/${ECR_REPOSITORY}:${GITHUB_SHA}"
          docker build --build-arg BUILD_REVISION="$GITHUB_SHA" -t "$image_uri" .
          docker push "$image_uri"
          echo "image_uri=$image_uri" >> "$GITHUB_OUTPUT"

      - name: EC2에 교체 요청하고 완료 확인
        run: bash scripts/ssm-deploy.sh "${{ steps.image.outputs.image_uri }}" "$GITHUB_SHA"

      - name: 요약
        run: |
          {
            echo "### 배포 요청 완료"
            echo "- 커밋: \`$GITHUB_SHA\`"
            echo "- 이미지: \`${{ steps.image.outputs.image_uri }}\`"
            echo "- 사용자 주소의 \`/health\`에서 \`build_revision\`이 위 커밋과 같은지 확인하세요."
          } >> "$GITHUB_STEP_SUMMARY"
